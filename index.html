<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Corridor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #050507; color: #fff;
    font-family: 'Courier New', Courier, monospace;
    touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; padding: 24px; display: flex;
    flex-direction: column; justify-content: space-between;
  }
  .hud { font-size: 14px; letter-spacing: 2px; opacity: 0.8; }
  .msg { text-align: center; margin-top: 12px; font-size: 16px;
    text-shadow: 0 0 8px #f00; opacity: 0; transition: opacity 0.3s; }
  .msg.show { opacity: 1; }
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; z-index: 10; pointer-events: auto;
    text-align: center;
  }
  h1 { font-size: 48px; letter-spacing: 6px; margin-bottom: 8px;
    color: #b22222; text-shadow: 0 0 12px #b22222; }
  p { font-size: 16px; margin-bottom: 24px; opacity: 0.85; }
  button {
    padding: 12px 32px; font-size: 18px; font-family: inherit;
    background: transparent; color: #fff; border: 2px solid #b22222;
    cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
  }
  button:hover { background: #b22222; }
  .controls { margin-top: 16px; font-size: 12px; opacity: 0.6; }
  #flashlight {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at center, rgba(255,255,220,0.25) 0%, transparent 70%);
    mix-blend-mode: overlay; z-index: 5;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.3; }
  }
  #flicker { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(18, 18, 24, 0.9), transparent);
    z-index: 6; opacity: 0.9; animation: flicker 4s infinite; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud">MIND: <span id="mind">100</span>%</div>
  <div id="msg" class="msg">Something is watching...</div>
</div>
<div id="flashlight"></div>
<div id="flicker"></div>
<div id="overlay">
  <h1>DARK CORRIDOR</h1>
  <p>You wake in an abandoned asylum. Something stalks the halls.<br>
  Find the 4 keys to escape. Don't let it catch you.</p>
  <button id="start">Enter</button>
  <div class="controls">WASD / Arrow keys to move • SPACE to interact • SHIFT to run</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mindEl = document.getElementById('mind');
const msgEl = document.getElementById('msg');
const overlay = document.getElementById('overlay');

let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

// ---------- audio ----------
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(freq, type='square', dur=0.1, vol=0.1, when=0){
  if(AC.state==='suspended') AC.resume();
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime+when);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+when+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(AC.currentTime+when); o.stop(AC.currentTime+when+dur);
}
function ambientDrone(){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type='sawtooth'; o.frequency.value=110;
  g.gain.value=0.03;
  o.connect(g); g.connect(AC.destination);
  o.start();
}
let audioStarted=false;

// ---------- input ----------
const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='Space'&&!gameStarted)startGame();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('mousedown',()=>{if(!audioStarted){ambientDrone();audioStarted=true;}});

// ---------- game state ----------
let gameStarted=false;
let player, entities, keysCollected=0, totalKeys=4, exit, map, fog;
let gameOver=false, won=false;
let flashlightOn=true;
let messageTimer=0;

const TILE=64;
const MAP_W=40, MAP_H=40;

// ---------- map generation (seeded) ----------
function seededRandom(seed){
  let s=seed;
  return function(){
    s=(s*16807)%2147483647;
    return (s-1)/2147483646;
  };
}
function generateMap(){
  const r=seededRandom(1337);
  const grid=Array(MAP_H).fill().map(()=>Array(MAP_W).fill(0));
  // rooms
  const rooms=[];
  for(let i=0;i<14;i++){
    const w=5+r()*7|0, h=5+r()*7|0;
    const x=1+(r()*(MAP_W-w-2))|0, y=1+(r()*(MAP_H-h-2))|0;
    rooms.push({x,y,w,h});
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)grid[yy][xx]=0;
  }
  // connect rooms with corridors
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1], b=rooms[i];
    let cx=a.x+(a.w/2)|0, cy=a.y+(a.h/2)|0;
    const tx=b.x+(b.w/2)|0, ty=b.y+(b.h/2)|0;
    while(cx!==tx){grid[cy][cx]=0; cx+=cx<tx?1:-1;}
    while(cy!==ty){grid[cy][cx]=0; cy+=cy<ty?1:-1;}
    grid[cy][cx]=0;
  }
  // walls
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++)
    if(grid[y][x]!==0) grid[y][x]=1;
  return grid;
}

class Player{
  constructor(){
    this.x=TILE*2+TILE/2; this.y=TILE*2+TILE/2;
    this.r=16; this.speed=2.2; this.run=3.6;
    this.mind=100; this.dir={x:0,y:0};
  }
  update(){
    let dx=0,dy=0;
    if(keys['KeyW']||keys['ArrowUp']) dy=-1;
    if(keys['KeyS']||keys['ArrowDown']) dy=1;
    if(keys['KeyA']||keys['ArrowLeft']) dx=-1;
    if(keys['KeyD']||keys['ArrowRight']) dx=1;
    const sp=(keys['ShiftLeft']||keys['ShiftRight'])?this.run:this.speed;
    let len=Math.hypot(dx,dy); if(len>0){dx/=len;dy/=len;}
    this.dir={x:dx,y:dy};
    this.x+=dx*sp; this.y+=dy*sp;
    this.x=Math.max(this.r,Math.min(W-TILE/2-this.r,this.x));
    this.y=Math.max(this.r,Math.min(H-TILE/2-this.r,this.y));
    // mind drain in dark / near monster
    let drain=0.05;
    if(!flashlightOn) drain+=0.1;
    entities.forEach(e=>{
      const d=Math.hypot(this.x-e.x,this.y-e.y);
      if(d<220) drain+=0.4*(220-d)/220;
    });
    this.mind=Math.max(0,this.mind-drain);
    mindEl.textContent=Math.ceil(this.mind);
    if(this.mind<=0) endGame(false);
  }
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.fillStyle='#44ff44';
    ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#22aa22'; ctx.lineWidth=2; ctx.stroke();
    // facing
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(this.dir.x*14,this.dir.y*14,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Entity{
  constructor(x,y,type){
    this.x=x; this.y=y; this.type=type; // 'key' or 'exit' or 'monster'
    this.r=14; this.active=true;
    this.angle=Math.random()*Math.PI*2;
    this.float=Math.random()*Math.PI*2;
  }
  update(){
    if(this.type==='monster'){
      this.angle+=0.02;
      const tx=player.x, ty=player.y;
      const dx=tx-this.x, dy=ty-this.y;
      const d=Math.hypot(dx,dy);
      if(d<400){
        const sp=1.4+(100-player.mind)*0.006;
        this.x+=(dx/d)*sp; this.y+=(dy/d)*sp;
      } else {
        // patrol
        this.x+=Math.cos(this.angle)*0.6;
        this.y+=Math.sin(this.angle)*0.6;
      }
      // collision with player
      if(Math.hypot(this.x-player.x,this.y-player.y)<this.r+player.r){
        player.mind-=2;
        tone(60, 'sawtooth', 0.4, 0.15);
        if(player.mind<=0) endGame(false);
      }
    }
  }
  draw(){
    if(!this.active) return;
    const t=Date.now()/1000;
    ctx.save(); ctx.translate(this.x,this.y);
    if(this.type==='key'){
      const scale=1+Math.sin(t*3)*0.1;
      ctx.fillStyle='#ffd700';
      ctx.beginPath(); ctx.moveTo(0,-this.r*scale); ctx.lineTo(this.r*scale*0.7,0);
      ctx.lineTo(0,this.r*scale*0.7); ctx.lineTo(-this.r*scale*0.7,0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#b8860b'; ctx.lineWidth=2; ctx.stroke();
    } else if(this.type==='exit'){
      const s=1+Math.sin(t*2)*0.15;
      ctx.fillStyle='#00ffff';
      ctx.beginPath(); ctx.arc(0,0,this.r*s,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#00ffff'; ctx.lineWidth=3; ctx.stroke();
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*this.r*s*1.5, Math.sin(a)*this.r*s*1.5); ctx.stroke();
      }
    } else if(this.type==='monster'){
      const s=1+Math.sin(t*6)*0.2;
      ctx.fillStyle='#1a1a1a';
      ctx.beginPath(); ctx.arc(0,0,this.r*s,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#440000'; ctx.lineWidth=3; ctx.stroke();
      // eyes
      ctx.fillStyle='#ff0000';
      ctx.beginPath(); ctx.arc(-6,-4,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(6,-4,3,0,Math.PI*2); ctx.fill();
      // mouth
      ctx.strokeStyle='#ff0000'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,4,6,0,Math.PI); ctx.stroke();
    }
    ctx.restore();
  }
}

function initGame(){
  map=generateMap();
  player=new Player();
  entities=[];
  // place keys in rooms
  const placed=[];
  let attempts=0;
  while(placed.length<totalKeys && attempts<200){
    attempts++;
    const rx=1+(Math.random()*(MAP_W-2))|0, ry=1+(Math.random()*(MAP_H-2))|0;
    if(map[ry][rx]===0 && !placed.some(p=>p.x===rx&&p.y===ry)){
      placed.push({x:rx,y:ry});
      entities.push(new Entity(rx*TILE+TILE/2, ry*TILE+TILE/2,'key'));
    }
  }
  // exit far from start
  entities.push(new Entity(TILE*(MAP_W-3)+TILE/2, TILE*(MAP_H-3)+TILE/2,'exit'));
  // monsters
  for(let i=0;i<3;i++){
    entities.push(new Entity(TILE*(10+i*8)+TILE/2, TILE*(10+i*5)+TILE/2,'monster'));
  }
  keysCollected=0; gameOver=false; won=false;
  flashlightOn=true;
  showMessage('Find the keys...', 2500);
}

function showMessage(text,ms=3000){
  msgEl.textContent=text; msgEl.classList.add('show');
  clearTimeout(msgEl._t);
  msgEl._t=setTimeout(()=>msgEl.classList.remove('show'),ms);
}

function startGame(){
  if(AC.state==='suspended') AC.resume();
  audioStarted=true; ambientDrone();
  overlay.style.display='none';
  gameStarted=true;
  initGame();
  tone(440,'square',0.1,0.1); tone(554,'square',0.1,0.1,0.1); tone(659,'square',0.15,0.1,0.2);
  requestAnimationFrame(loop);
}

function endGame(win){
  gameOver=true; won=win;
  overlay.innerHTML=`
    <h1 style="color:${win?'#00ffff':'#b22222'}">${win?'YOU ESCAPED':'YOU DIED'}</h1>
    <p>${win?'You made it out alive.':'The darkness took you.'}</p>
    <button id="restart">Try Again</button>
  `;
  overlay.style.display='flex';
  document.getElementById('restart').onclick=()=>{
    overlay.style.display='none'; gameOver=false; initGame();
    requestAnimationFrame(loop);
  };
  tone(win?880:60, win?'square':'sawtooth', win?0.5:1, 0.2);
}

function drawMap(){
  ctx.save();
  // draw walls as dark blocks
  ctx.fillStyle='#0a0a0c';
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      if(map[y][x]===1){
        ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
        ctx.strokeStyle='#1a1a20'; ctx.lineWidth=1; ctx.strokeRect(x*TILE,y*TILE,TILE,TILE);
      }
    }
  }
  ctx.restore();
}

let lastTime=0;
function loop(t){
  if(!gameStarted||gameOver) return;
  const dt=(t-lastTime)/16;
  lastTime=t;
  ctx.fillStyle='#050507'; ctx.fillRect(0,0,W,H);
  drawMap();
  entities.forEach(e=>{e.update(); e.draw();});
  player.update(); player.draw();
  // flashlight glow
  if(flashlightOn){
    const g=ctx.createRadialGradient(player.x,player.y,10,player.x,player.y,260);
    g.addColorStop(0,'rgba(255,255,200,0.15)');
    g.addColorStop(1,'rgba(255,255,200,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  // collect keys / exit
  entities.forEach(e=>{
    if(e.active && e.type!=='monster' && Math.hypot(player.x-e.x,player.y-e.y)<e.r+player.r){
      if(e.type==='key'){ e.active=false; keysCollected++; tone(880,'sine',0.1,0.1); showMessage('Key collected ('+keysCollected+'/'+totalKeys+')',1500);}
      if(e.type==='exit' && keysCollected===totalKeys){ endGame(true); }
    }
  });
  if(messageTimer>0){messageTimer--;}
  requestAnimationFrame(loop);
}

// toggle flashlight
window.addEventListener('keydown',e=>{
  if(e.code==='KeyF'){ flashlightOn=!flashlightOn; tone(400,'square',0.05,0.05);}
});

</script>
</body>
</html>
